name: sync

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Refresh versions.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/update-versions.sh
      - name: Check builds still pass
        run: |
          nix flake update
          nix flake check --print-build-logs
          nix build .#slssteam .#slsteam-moon .#lumen .#luatools .#assella
      - name: Open update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing to update"
            exit 0
          fi
          BR="chore/weekly-upstream"
          git checkout -B "$BR"
          git add nix/versions.json flake.lock
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: bump upstream versions"
          git push -f origin "$BR"
          gh pr create --fill --head "$BR" || gh pr edit "$BR" --add-label dependencies || true
